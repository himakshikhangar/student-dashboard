<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rail.css">
<link rel="stylesheet" href="home.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("sd.v1")).theme}catch(e){}</script>
<script>try{if(!sessionStorage.getItem("sd.intro")&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("intro-lock");setTimeout(function(){try{document.documentElement.classList.remove("intro-lock");var n=document.getElementById("intro");if(n)n.remove()}catch(e){}},4000)}catch(e){}</script>
</head>
<body>
<div id="intro"></div>
<aside id="nav">
  <div class="logo"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div><b>Campus Desk</b></div>
  <nav id="tabs"></nav>
</aside>
<main>
  <header>
    <div><h1 id="title"></h1><p id="sub"></p></div>
    <button id="themeBtn" class="btn y">Change Theme</button>
  </header>
  <section id="view" class="view"></section>
</main>
<aside id="rail" aria-label="Live panel"></aside>
<div id="toast" role="status"></div>
<script src="app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/animejs@4/dist/bundles/anime.umd.min.js"></script>
<script defer src="anime-intro.js"></script>
<script defer src="anime-fx.js"></script>
<script defer src="anime-nav.js"></script>
<script defer src="anime-fill.js"></script>
<script defer src="anime-home.js"></script>
<script defer src="anime-rail.js"></script>
</body>
</html>
